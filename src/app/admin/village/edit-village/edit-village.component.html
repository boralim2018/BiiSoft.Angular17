<form novalidate autocomplete="off" #editVillageForm="ngForm" (ngSubmit)="save()" [busy]="saving">
    <div class="formgrid grid p-3 m-0">
        <div class="field col-12 md:col-6"
             inputText
             name="name"
             [label]="l('Name')"
             [maxlength]="128"
             [(ngModel)]="model.name"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputText
             name="displayName"
             [label]="l('DisplayName')"
             [maxlength]="128"
             [(ngModel)]="model.displayName"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputText
             name="code"
             [label]="l('Code_',l('Village'))"
             [minlength]="15"
             [maxlength]="15"
             [(ngModel)]="model.code"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             findCountry
             name="country"
             [required]="true"
             [label]="l('Country')"
             [(ngModel)]="country"
             (ngModelChange)="model.countryId = $event?.id">
        </div>
        <div class="field col-12 md:col-6"
             findCityProvince
             name="cityProvince"
             [countries]="country"
             [required]="true"
             [label]="l('CityProvince')"
             [(ngModel)]="cityProvince"
             (ngModelChange)="model.cityProvinceId = $event?.id">
        </div>
        <div class="field col-12 md:col-6"
             findKhanDistrict
             name="khanDistrict"
             [countries]="country"
             [cityProvinces]="cityProvince"
             [required]="true"
             [label]="l('KhanDistrict')"
             [(ngModel)]="khanDistrict"
             (ngModelChange)="model.khanDistrictId = $event?.id">
        </div>
        <div class="field col-12 md:col-6"
             findSangkatCommune
             name="sangkatCommune"
             [countries]="country"
             [cityProvinces]="cityProvince"
             [khanDistricts]="khanDistrict"
             [required]="true"
             [label]="l('SangkatCommune')"
             [(ngModel)]="sangkatCommune"
             (ngModelChange)="model.sangkatCommuneId = $event?.id">
        </div>
    </div>

    <div class="p-dialog-footer">
        <div class="flex justify-content-end flex-wrap">
            <button pButton pRipple
                    label="{{'Save' | localize}}"
                    class=""
                    icon="pi pi-save"
                    type="submit"
                    [disabled]="!editVillageForm.form.valid|| saving"></button>
        </div>
    </div>
</form>
