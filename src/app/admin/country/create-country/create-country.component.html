<form novalidate autocomplete="off" #createCountryForm="ngForm" (ngSubmit)="save()" [busy]="saving">
    <div class="formgrid grid p-3 m-0">
        <div class="field col-12 md:col-6"
             inputText
             name="name"
             [label]="l('Name')"
             [maxlength]="128"
             [(ngModel)]="model.name"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputText
             name="displayName"
             [label]="l('DisplayName')"
             [maxlength]="128"
             [(ngModel)]="model.displayName"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputText
             name="code"
             [label]="l('Code_',l('Country'))"
             [minlength]="3"
             [maxlength]="3"
             [(ngModel)]="model.code"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputText
             name="iso"
             [label]="l('ISO')"
             [minlength]="3"
             [maxlength]="3"
             [(ngModel)]="model.iso"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputText
             name="isO2"
             [label]="l('ISO2')"
             [minlength]="2"
             [maxlength]="2"
             [(ngModel)]="model.isO2"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputText
             name="phonePrefix"
             [label]="l('PhonePrefix')"
             [maxlength]="6"
             [(ngModel)]="model.phonePrefix">
        </div>
        
        <div class="field col-12 md:col-6"
             findCurrency
             name="currency"
             [label]="l('Currency')"
             [(ngModel)]="currency"
             (ngModelChange)="model.currencyId = $event?.id">
        </div>

    </div>

    <div class="p-dialog-footer">
        <div class="flex justify-content-end flex-wrap">
            <button pButton pRipple
                    label="{{'SaveNew' | localize}}"
                    class=""
                    icon="pi pi-save"
                    type="button"
                    (click)="saveNew(createCountryForm)"
                    [disabled]="!(createCountryForm.form.valid )|| saving"></button>
            <button pButton pRipple
                    label="{{'Save' | localize}}"
                    class=""
                    icon="pi pi-save"
                    type="submit"
                    [disabled]="!(createCountryForm.form.valid )|| saving"></button>
        </div>
    </div>
</form>
