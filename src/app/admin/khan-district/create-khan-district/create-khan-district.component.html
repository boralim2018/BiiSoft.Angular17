<form novalidate autocomplete="off" #createKhanDistrictForm="ngForm" (ngSubmit)="save()" [busy]="saving">
    <div class="formgrid grid p-3 m-0">
        <div class="field col-12 md:col-6"
             inputText
             name="name"
             [label]="l('Name')"
             [maxlength]="128"
             [(ngModel)]="model.name"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputText
             name="displayName"
             [label]="l('DisplayName')"
             [maxlength]="128"
             [(ngModel)]="model.displayName"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputText
             name="code"
             [label]="l('Code_',l('KhanDistrict'))"
             [minlength]="9"
             [maxlength]="9"
             [(ngModel)]="model.code"
             [required]="true">
        </div>
        
        <div class="field col-12 md:col-6"
             findCountry
             name="country"
             [required]="true"
             [label]="l('Country')"
             [(ngModel)]="country"
             (ngModelChange)="model.countryId = $event?.id">
        </div>
        <div class="field col-12 md:col-6"
             findCityProvince
             name="cityProvince"
             [countries]="country"
             [required]="true"
             [label]="l('CityProvince')"
             [(ngModel)]="cityProvince"
             (ngModelChange)="model.cityProvinceId = $event?.id">
        </div>

    </div>

    <div class="p-dialog-footer">
        <div class="flex justify-content-end flex-wrap">
            <button pButton pRipple
                    label="{{'SaveNew' | localize}}"
                    class=""
                    icon="pi pi-save"
                    type="button"
                    (click)="saveNew(createKhanDistrictForm)"
                    [disabled]="!createKhanDistrictForm.form.valid|| saving"></button>
            <button pButton pRipple
                    label="{{'Save' | localize}}"
                    class=""
                    icon="pi pi-save"
                    type="submit"
                    [disabled]="!createKhanDistrictForm.form.valid|| saving"></button>
        </div>
    </div>
</form>
