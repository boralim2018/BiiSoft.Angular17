<p-tabView [(activeIndex)]="activeIndex" (activeIndexChange)="saveCache()">
    <p-tabPanel header="{{l('Items')}}" *ngIf="canViewItem">
        <app-item></app-item>
    </p-tabPanel>
    <p-tabPanel header="{{l('Settings')}}" *ngIf="canViewItemSetting">
        <app-item-setting></app-item-setting>
    </p-tabPanel>
    <p-tabPanel header="{{l('CodeFormula')}}" *ngIf="canViewItemCodeFormula && appSession.itemSetting?.useCodeFormula">
        <app-item-code-formula></app-item-code-formula>
    </p-tabPanel>
    <p-tabPanel header="{{l('ModifierItems')}}">

    </p-tabPanel>
    <p-tabPanel header="{{l('AddOnItems')}}">

    </p-tabPanel>
    <p-tabPanel header="{{l('BOM')}}" *ngIf="canViewBOM">

    </p-tabPanel>
</p-tabView>
