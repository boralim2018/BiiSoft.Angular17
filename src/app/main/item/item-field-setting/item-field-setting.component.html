<div class="pt-3">
    <div class="formgrid grid m-0">
        <div class="field col-12 md:col-6">
            <div class="flex align-content-center gap-3">
                <p-inputSwitch name="useCode" [(ngModel)]="model.useCode"></p-inputSwitch>
                <span class="mb-3">{{l('Use_', l('Code'))}}</span>
            </div>
        </div>        
    </div>

    <div class="flex justify-content-end gap-2 py-4">
        <p-button [label]="l('Save')" (onClick)="save()" [loading]="saving" />
    </div>

</div>
