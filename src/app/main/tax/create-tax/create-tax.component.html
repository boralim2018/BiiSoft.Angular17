<form novalidate autocomplete="off" #createTaxForm="ngForm" (ngSubmit)="save()" [busy]="saving">
    <div class="formgrid grid p-3 m-0">
        <div class="field col-12 md:col-6"
             inputText
             name="name"
             [label]="l('Name')"
             maxlength="128"
             [(ngModel)]="model.name"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputText
             name="displayName"
             [label]="l('DisplayName')"
             maxlength="128"
             [(ngModel)]="model.displayName"
             [required]="true">
        </div>
        <div class="field col-12 md:col-6"
             inputNumber
             name="rate"
             [label]="l('Rate')"
             [(ngModel)]="model.rate"
             [required]="true"
             [maxDigits]="2">
        </div>
        
        <div class="field col-12 md:col-6"
             findChartOfAccount
             name="purchaseAccount"
             [required]="true"
             [label]="l('PurchaseAccount')"
             [(ngModel)]="purchaseAccount"
             (ngModelChange)="model.purchaseAccountId = $event?.id">
        </div>
        <div class="field col-12 md:col-6"
             findChartOfAccount
             name="saleAccount"
             [required]="true"
             [label]="l('SaleAccount')"
             [(ngModel)]="saleAccount"
             (ngModelChange)="model.saleAccountId = $event?.id">
        </div>

    </div>

    <div class="p-dialog-footer">
        <div class="flex justify-content-end flex-wrap">
            <button pButton pRipple
                    label="{{'SaveNew' | localize}}"
                    class=""
                    icon="pi pi-save"
                    type="button"
                    (click)="saveNew(createTaxForm)"
                    [disabled]="!createTaxForm.form.valid|| saving"></button>
            <button pButton pRipple
                    label="{{'Save' | localize}}"
                    class=""
                    icon="pi pi-save"
                    type="submit"
                    [disabled]="!createTaxForm.form.valid|| saving"></button>
        </div>
    </div>
</form>
